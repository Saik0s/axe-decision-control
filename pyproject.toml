[project]
name = "axe-decision-control"
version = "0.1.0"
description = "Bounded iOS Simulator control through AXe and decision models"
readme = "README.md"
license = "MIT"
authors = [{name = "Igor Tarasenko"}]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "Pillow>=11,<13"]

[project.scripts]
axe-control = "axe_control.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-Pillow>=10"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axe_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
