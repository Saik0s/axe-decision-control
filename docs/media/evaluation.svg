<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">A model's DONE is one part of a passing evaluation</title><desc id="desc">Skill routing, controller judgment, native app state, and proof integrity answer different questions. Strict benchmark pass requires all controller, outcome and integrity gates. Routing evals are separate and unmeasured unless an actual agent is run.</desc>
<rect width="1120" height="440" rx="20" fill="#f5f3ee"/>
<g font-family="system-ui,Arial,sans-serif" fill="#172a2b"><text x="40" y="48" font-size="26" font-weight="700">DONE ≠ independently verified success</text><text x="40" y="80" font-size="16">Separate what the agent believes from what the app actually did.</text></g>
<g fill="#fff" stroke="#c5cec9"><rect x="40" y="112" width="320" height="145" rx="12"/><rect x="400" y="112" width="320" height="145" rx="12"/><rect x="760" y="112" width="320" height="145" rx="12"/></g>
<g font-family="system-ui,Arial,sans-serif" fill="#172a2b" font-size="16"><text x="60" y="146" font-size="19" font-weight="700">Controller judgment</text><text x="60" y="181">Fresh observation says complete</text><text x="60" y="211">Run report + expected exit code</text><text x="420" y="146" font-size="19" font-weight="700">Independent app outcome</text><text x="420" y="181">Name, duration, quiet, running</text><text x="420" y="211">Fixture state + visible labels</text><text x="780" y="146" font-size="19" font-weight="700">Evidence integrity</text><text x="780" y="181">Valid files + consistent reports</text><text x="780" y="211">All expected attempts accounted for</text></g>
<g stroke="#172a2b" fill="none" stroke-width="2"><path d="M200 257V281H920V257M560 281V304"/></g>
<rect x="390" y="308" width="340" height="54" rx="9" fill="#172a2b"/><text x="423" y="343" font-family="system-ui,Arial,sans-serif" font-size="19" fill="#fff">All gates → strict benchmark pass</text>
<text x="40" y="407" font-family="system-ui,Arial,sans-serif" fill="#546863" font-size="16">Skill-routing evals are separate. A case file or passing unit test does not measure an agent's skill use.</text>
</svg>
